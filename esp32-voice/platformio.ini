; PlatformIO Configuration for ESP32 Voice Device
; Following agtos.firmware.esp32.v1 specification

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DWAKE_WORD="hey_chichi"
    -DWEBRTC_SERVER="ws://192.168.1.100:3000/webrtc"
    -DDEVICE_ID="esp32-voice-001"

; Libraries for Arduino framework (if switching to Arduino)
; lib_deps = 
;     WebSockets
;     ArduinoJson
;     ESP32-A2DP

; Custom partition table for OTA and audio buffers
extra_scripts = pre:scripts/gen_partition.py

; Monitor filters
monitor_filters = 
    esp32_exception_decoder
    colorize
    time

; Upload settings for OTA
upload_protocol = espota
upload_port = esp32-voice.local
upload_flags = 
    --port=3232
    --auth=agtos-ota-2024